name: links
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  pull_request:
    paths: ["**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in Markdown
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 20
            --max-retries 2
            --accept 200,206,403,429,999
            --exclude-path docs/demos
            './**/*.md'
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Open an issue for dead links (weekly run)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead source links found"
          content-filepath: ./lychee/out.md
          labels: accuracy, good first issue
